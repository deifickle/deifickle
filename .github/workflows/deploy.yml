# Copies the site to NearlyFreeSpeech.net whenever the release branch changes.
# Setup (once) is described in README.md under "Automatic deploy".
name: Deploy to NFSN

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NFSN_HOST: ${{ secrets.NFSN_HOST }}
      NFSN_USER: ${{ secrets.NFSN_USER }}
      NFSN_SSH_KEY: ${{ secrets.NFSN_SSH_KEY }}
      NFSN_KNOWN_HOSTS: ${{ secrets.NFSN_KNOWN_HOSTS }}
    steps:
      - name: Check deploy settings
        id: check
        run: |
          if [ -z "$NFSN_HOST" ] || [ -z "$NFSN_USER" ] || [ -z "$NFSN_SSH_KEY" ] || [ -z "$NFSN_KNOWN_HOSTS" ]; then
            echo "::notice::Deploy skipped: NFSN_HOST, NFSN_USER, NFSN_SSH_KEY and NFSN_KNOWN_HOSTS secrets are not all set."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          # The key may be stored as-is or base64-encoded on one line (safer to
          # paste in the browser). Windows line endings are stripped either way.
          key=$(printf '%s' "$NFSN_SSH_KEY" | tr -d '\r')
          case "$key" in
            -----BEGIN*) printf '%s\n' "$key" > ~/.ssh/deploy_key ;;
            *) printf '%s' "$key" | tr -d ' \n' | base64 -d > ~/.ssh/deploy_key ;;
          esac
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$NFSN_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::NFSN_SSH_KEY is not a valid private key. Paste the whole nfsn_deploy file, BEGIN and END lines included."; exit 1; }

      - name: Copy site to /home/public
        if: steps.check.outputs.ready == 'true'
        run: |
          rsync -rlz --delete --itemize-changes \
            --exclude '.git/' --exclude '.github/' --exclude '.gitignore' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$NFSN_USER@$NFSN_HOST:/home/public/"
